<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div id="save-toast" style="
            display: none; 
            position: fixed; 
            bottom: 20px; 
            left: 50%; 
            transform: translateX(-50%);
            background: #333; 
            color: #fff; 
            padding: 10px 20px; 
            border-radius: 5px; 
            z-index: 1000;">
            Saved!
        </div>
        <div class="settings">
        <img id="settings" onclick="openSettings()" src="settings.jpg" style="position: absolute; top: 0; right: 0; scale: 0.15; transform-origin: top right; cursor: pointer">
        </div>
        <h1>Points: <span id='score'> 0 </span></h1>
        <button class="clicker" onclick="increaseScore()"></button>
        <button class="save" onclick="save()">Save</button>
        <button class="clear" onclick="clearData()">Clear all data</button>
        <div id="shop" style="margin-top: 20px; border-top: 2px solid #333; padding-top: 20px;">
            <h2>Shop</h2>
            <button id="upgradeMouse" onclick="handleUpgrades('mouse')" class="shop">
                Better Formula (Cost: <span id='mousecost'>15</span>)
            </button>
            <button id="upgradeAuto" onclick="handleUpgrades('autoclicker')" class="shop">
                New Comic (Cost: <span id='autoclickercost'>100</span>) <!--Multiplier: 1.15-->
            </button>
            <button id="spawndvd" onclick="handleUpgrades('dvd')" class="shop">
                New What If? (Cost: <span id="dvdcost">1000</span>)
            </button>
            <button id="Book" onclick="handleUpgrades('book')" class="shop">New Book (Cost: <span id="bookcost">12000</span>)</button>
        </div>
        Images by <a href="https://xkcd.com" target="_blank">xkcd.com</a>
        <script defer src="script.js"></script>
    </body>
</html>
