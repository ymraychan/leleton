<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div style="display:flex; gap:20px; margin-top: 10px; box-sizing: border-box; padding: 10px; margin: 0;">
            <input type="text" placeholder="Ask the magic 8 ball" id="ask">
        </div>
        <button onclick="generateRandomResponse(true)" id="normal">Ask the magic 8 ball</button><br>
        <button id="neutral" onclick="generateRandomResponse(false)" class="hidden">Ask again</button><br>
        <input type="text" id="output" readonly><br>
        <script src="scripts.js"></script>
    </body>
</html>
